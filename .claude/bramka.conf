# Wzorce bramki publikacji Zenifi, używane przez globalny hook przed-deployem.sh.
# Lokalny Metro/Expo dev server oraz `expo run:android` nie są publikacją.
# Bramka obejmuje buildy dystrybucyjne, EAS Update i wysłanie aplikacji do sklepu.

KOMENDY_ZAWSZE='(eas[[:space:]]+(build|submit|update)|expo[[:space:]]+publish)'
